[package]
name = "berry-youtube-manager-mcp"
version = "0.1.0"
edition = "2024"
description = "Berry is a YouTube channel manager: an MCP server for YouTube Data API."
license = "MIT"
readme = "README.md"

[[bin]]
name = "youtube-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
google-cloud-auth = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.9", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

